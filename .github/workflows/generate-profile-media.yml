name: Generate profile media

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate-profile-media.py
      - .github/workflows/generate-profile-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate profile hero
        run: python scripts/generate-profile-media.py

      - name: Commit generated hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-hero.png
          if git diff --cached --quiet; then
            echo "No generated hero changes"
            exit 0
          fi
          git commit -m "feat: refresh profile hero [skip ci]"
          git push origin HEAD:main
