name: Cleanup merged Profile Signal branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-profile-signal-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged work branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            fix/profile-signal-schedule-fallback \
            fix/profile-signal-independent-trigger
          do
            echo "Deleting merged branch: ${branch}"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/git/refs/heads/${branch}"
          done
