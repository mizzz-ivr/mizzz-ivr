name: Update profile activity

on:
  pull_request:
    paths:
      - README.md
      - .github/profile-signal.yml
      - profile-signal-action/**
      - scripts/update-profile-activity.py
      - scripts/profile_signal.py
      - scripts/update-profile-signal.py
      - scripts/profile_signal_operations.py
      - scripts/profile_signal_history.py
      - tests/test_profile_signal.py
      - tests/test_profile_signal_history.py
      - tests/test_profile_signal_action.py
      - .github/workflows/update-readme.yml
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-profile-activity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python and action config
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python -m py_compile \
            scripts/update-profile-activity.py \
            scripts/profile_signal.py \
            scripts/update-profile-signal.py \
            scripts/profile_signal_operations.py \
            scripts/profile_signal_history.py \
            profile-signal-action/src/orchestrator.py
          python -m unittest discover -s tests -v

      - name: Generate Profile Signal preview through local action
        uses: ./profile-signal-action
        with:
          config: .github/profile-signal.yml

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- README.md
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          logs = sorted(Path("data/activity").glob("*/*/*.json"))
          if not logs:
              raise SystemExit("No activity snapshots were generated")

          for path in logs:
              json.loads(path.read_text(encoding="utf-8"))

          weekly = sorted(Path("data/weekly").glob("*.json"))
          monthly = sorted(Path("data/monthly").glob("*.json"))
          if not weekly or not monthly:
              raise SystemExit("Weekly / monthly history reports were not generated")
          for path in [*weekly, *monthly]:
              report = json.loads(path.read_text(encoding="utf-8"))
              if "metrics" not in report or "coverage" not in report:
                  raise SystemExit(f"History report missing metrics / coverage: {path}")

          state = json.loads(Path("data/profile-signal-state.json").read_text(encoding="utf-8"))
          for key in (
              "status",
              "code_weather",
              "streak",
              "current_focus",
              "dev_pulse",
              "now_building",
              "activity_stream",
              "ci_signal",
              "dev_recap",
          ):
              if key not in state:
                  raise SystemExit(f"Missing Profile Signal state key: {key}")

          if state.get("schema_version") != 4:
              raise SystemExit("Profile Signal state must use schema version 4")
          if len(state["dev_pulse"]) != 7:
              raise SystemExit("DEV PULSE must contain exactly seven days")
          if len(state["now_building"]) > 3:
              raise SystemExit("NOW BUILDING must contain at most three repositories")
          if len(state["activity_stream"]) > 4:
              raise SystemExit("ACTIVITY STREAM must contain at most four events")

          for repo in state["now_building"]:
              if "health" not in repo or "ci" not in repo:
                  raise SystemExit("NOW BUILDING repository is missing health / CI state")

          ci = state["ci_signal"]
          for key in ("label", "evaluated", "passed", "failed", "pass_rate", "repos_with_signal"):
              if key not in ci:
                  raise SystemExit(f"CI SIGNAL is missing key: {key}")

          recap = state["dev_recap"]
          for key in ("tracked_from", "tracked_days", "active_days", "longest_streak", "weekly", "monthly", "achievements"):
              if key not in recap:
                  raise SystemExit(f"DEV RECAP is missing key: {key}")

          readme = Path("README.md").read_text(encoding="utf-8")
          for marker in (
              "PROFILE-SIGNAL:LIVE-SIGNAL:START",
              "DAILY-ACTIVITY:START",
              "PROFILE-SIGNAL:FOCUS:START",
              "PROFILE-SIGNAL:PULSE:START",
              "PROFILE-SIGNAL:NOW-BUILDING:START",
              "PROFILE-SIGNAL:ACTIVITY-STREAM:START",
              "PROFILE-SIGNAL:RECAP:START",
          ):
              if marker not in readme:
                  raise SystemExit(f"Missing README marker: {marker}")

          if "Today&apos;s signal" in readme:
              raise SystemExit("TODAY still duplicates ACTIVITY STREAM")
          if "CI SIGNAL" not in readme:
              raise SystemExit("DEV PULSE is missing CI SIGNAL")
          if "health combines repository recency" not in readme:
              raise SystemExit("NOW BUILDING is missing project health explanation")
          if "MONTHLY BUILD REPORT + ACHIEVEMENTS" not in readme:
              raise SystemExit("DEV RECAP is missing collapsed monthly / achievements content")
          if "not lifetime GitHub totals" not in readme:
              raise SystemExit("DEV RECAP must disclose tracked-history scope")

          ET.parse("assets/activity-7d.svg")
          ET.parse("assets/dev-pulse.svg")
          print(
              f"Validated {len(logs)} daily snapshots, {len(weekly)} weekly reports, "
              f"{len(monthly)} monthly reports, Profile Signal v4 state, local action dogfood and seven profile sections"
          )
          PY

  update-profile-activity:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python and action config
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python -m py_compile \
            scripts/update-profile-activity.py \
            scripts/profile_signal.py \
            scripts/update-profile-signal.py \
            scripts/profile_signal_operations.py \
            scripts/profile_signal_history.py \
            profile-signal-action/src/orchestrator.py
          python -m unittest discover -s tests -v

      - name: Update profile through local Profile Signal action
        uses: ./profile-signal-action
        with:
          config: .github/profile-signal.yml

      - name: Commit generated profile activity
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- README.md assets/activity-7d.svg assets/dev-pulse.svg data/activity data/weekly data/monthly data/profile-signal-state.json)" ]; then
            echo "No profile activity changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            assets/activity-7d.svg \
            assets/dev-pulse.svg \
            data/activity \
            data/weekly \
            data/monthly \
            data/profile-signal-state.json
          git commit -m "chore(profile): refresh Profile Signal [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed (attempt ${attempt}); rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push profile activity after 3 attempts" >&2
          exit 1
