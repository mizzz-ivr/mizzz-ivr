name: Update profile activity

on:
  pull_request:
    paths:
      - README.md
      - scripts/update-profile-activity.py
      - scripts/profile_signal.py
      - scripts/update-profile-signal.py
      - scripts/profile_signal_operations.py
      - tests/test_profile_signal.py
      - .github/workflows/update-readme.yml
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-profile-activity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python
        run: |
          python -m py_compile \
            scripts/update-profile-activity.py \
            scripts/profile_signal.py \
            scripts/update-profile-signal.py \
            scripts/profile_signal_operations.py
          python -m unittest discover -s tests -v

      - name: Generate activity preview
        env:
          GITHUB_LOGIN: mizzz-ivr
          PROFILE_TIMEZONE: Asia/Tokyo
        run: |
          python scripts/update-profile-activity.py
          python scripts/update-profile-signal.py
          python scripts/profile_signal_operations.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- README.md
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          logs = sorted(Path("data/activity").glob("*/*/*.json"))
          if not logs:
              raise SystemExit("No activity snapshots were generated")

          for path in logs:
              json.loads(path.read_text(encoding="utf-8"))

          state = json.loads(Path("data/profile-signal-state.json").read_text(encoding="utf-8"))
          for key in (
              "status",
              "code_weather",
              "streak",
              "current_focus",
              "dev_pulse",
              "now_building",
              "activity_stream",
              "ci_signal",
          ):
              if key not in state:
                  raise SystemExit(f"Missing Profile Signal state key: {key}")

          if state.get("schema_version") != 3:
              raise SystemExit("Profile Signal state must use schema version 3")
          if len(state["dev_pulse"]) != 7:
              raise SystemExit("DEV PULSE must contain exactly seven days")
          if len(state["now_building"]) > 3:
              raise SystemExit("NOW BUILDING must contain at most three repositories")
          if len(state["activity_stream"]) > 4:
              raise SystemExit("ACTIVITY STREAM must contain at most four events")

          for repo in state["now_building"]:
              if "health" not in repo or "ci" not in repo:
                  raise SystemExit("NOW BUILDING repository is missing health / CI state")

          ci = state["ci_signal"]
          for key in ("label", "evaluated", "passed", "failed", "pass_rate", "repos_with_signal"):
              if key not in ci:
                  raise SystemExit(f"CI SIGNAL is missing key: {key}")

          readme = Path("README.md").read_text(encoding="utf-8")
          for marker in (
              "PROFILE-SIGNAL:LIVE-SIGNAL:START",
              "DAILY-ACTIVITY:START",
              "PROFILE-SIGNAL:FOCUS:START",
              "PROFILE-SIGNAL:PULSE:START",
              "PROFILE-SIGNAL:NOW-BUILDING:START",
              "PROFILE-SIGNAL:ACTIVITY-STREAM:START",
          ):
              if marker not in readme:
                  raise SystemExit(f"Missing README marker: {marker}")

          if "Today&apos;s signal" in readme:
              raise SystemExit("TODAY still duplicates ACTIVITY STREAM")
          if "CI SIGNAL" not in readme:
              raise SystemExit("DEV PULSE is missing CI SIGNAL")
          if "health combines repository recency" not in readme:
              raise SystemExit("NOW BUILDING is missing project health explanation")

          ET.parse("assets/activity-7d.svg")
          ET.parse("assets/dev-pulse.svg")
          print(
              f"Validated {len(logs)} JSON snapshots, Profile Signal v3 state, "
              "project health, CI signal, six profile sections and both SVG assets"
          )
          PY

  update-profile-activity:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python
        run: |
          python -m py_compile \
            scripts/update-profile-activity.py \
            scripts/profile_signal.py \
            scripts/update-profile-signal.py \
            scripts/profile_signal_operations.py
          python -m unittest discover -s tests -v

      - name: Update activity snapshot, widgets and README
        env:
          GITHUB_LOGIN: mizzz-ivr
          PROFILE_TIMEZONE: Asia/Tokyo
        run: |
          python scripts/update-profile-activity.py
          python scripts/update-profile-signal.py
          python scripts/profile_signal_operations.py

      - name: Commit generated profile activity
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- README.md assets/activity-7d.svg assets/dev-pulse.svg data/activity data/profile-signal-state.json)" ]; then
            echo "No profile activity changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            assets/activity-7d.svg \
            assets/dev-pulse.svg \
            data/activity \
            data/profile-signal-state.json
          git commit -m "chore(profile): refresh Profile Signal [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed (attempt ${attempt}); rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push profile activity after 3 attempts" >&2
          exit 1
