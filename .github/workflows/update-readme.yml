name: Update profile activity

on:
  pull_request:
    paths:
      - README.md
      - README.en.md
      - .profile-signalignore
      - scripts/profile_signal_customize.py
      - scripts/localize_profile_activity.py
      - tests/test_profile_signal_customize.py
      - tests/test_localize_profile_activity.py
      - .github/profile-signal.yml
      - .profile-signal/**
      - .github/workflows/update-readme.yml
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
      timezone: "Asia/Tokyo"
    - cron: "19 */3 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-signal-profile-write-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  validate-profile-activity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate installed runtime and consumer customization
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python -m py_compile \
            .profile-signal/src/*.py \
            .profile-signal/scripts/*.py \
            scripts/profile_signal_customize.py \
            scripts/localize_profile_activity.py
          python -m unittest \
            tests.test_profile_signal_customize \
            tests.test_localize_profile_activity \
            -v

      - name: Generate Profile Signal preview through installed runtime
        uses: ./.profile-signal
        with:
          config: .github/profile-signal.yml

      - name: Validate lightweight latest-signals runtime
        env:
          PROFILE_SIGNAL_CONFIG: .github/profile-signal.yml
        run: python .profile-signal/src/stream_runtime.py

      - name: Apply consumer view and repository filters
        run: python scripts/profile_signal_customize.py

      - name: Localize known activity titles
        run: python scripts/localize_profile_activity.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- README.md data/profile-signal-state.json
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          logs = sorted(Path("data/activity").glob("*/*/*.json"))
          if not logs:
              raise SystemExit("No activity snapshots were generated")
          for path in logs:
              json.loads(path.read_text(encoding="utf-8"))

          weekly = sorted(Path("data/weekly").glob("*.json"))
          monthly = sorted(Path("data/monthly").glob("*.json"))
          if not weekly or not monthly:
              raise SystemExit("Weekly / monthly history reports were not generated")
          for path in [*weekly, *monthly]:
              report = json.loads(path.read_text(encoding="utf-8"))
              if "metrics" not in report or "coverage" not in report:
                  raise SystemExit(f"History report missing metrics / coverage: {path}")

          state = json.loads(Path("data/profile-signal-state.json").read_text(encoding="utf-8"))
          for key in (
              "status",
              "code_weather",
              "streak",
              "current_focus",
              "dev_pulse",
              "now_building",
              "activity_stream",
              "ci_signal",
              "dev_recap",
              "tracked_summary",
          ):
              if key not in state:
                  raise SystemExit(f"Missing Profile Signal state key: {key}")

          if state.get("schema_version") != 4:
              raise SystemExit("Profile Signal state must use schema version 4")
          if len(state["dev_pulse"]) != 7:
              raise SystemExit("DEV PULSE must contain exactly seven days")
          if len(state["now_building"]) > 3:
              raise SystemExit("NOW BUILDING must contain at most three repositories")
          if len(state["activity_stream"]) > 4:
              raise SystemExit("ACTIVITY STREAM must contain at most four events")

          tracked = state["tracked_summary"]
          for scope in ("yearly", "lifetime"):
              summary = tracked.get(scope) or {}
              for key in ("tracked_days", "active_days", "metrics"):
                  if key not in summary:
                      raise SystemExit(f"Tracked {scope} summary missing key: {key}")
          if tracked["lifetime"]["tracked_days"] < tracked["yearly"]["tracked_days"]:
              raise SystemExit("Lifetime tracked days cannot be lower than yearly tracked days")

          ignored = {line.strip() for line in Path('.profile-signalignore').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#') and '*' not in line and '?' not in line}
          focus_repo = str((state.get('current_focus') or {}).get('repo') or '')
          if focus_repo in ignored:
              raise SystemExit(f"Ignored repository remained in current focus: {focus_repo}")
          for collection in (state.get('now_building') or [], state.get('activity_stream') or []):
              for item in collection:
                  if str(item.get('repo') or '') in ignored:
                      raise SystemExit(f"Ignored repository remained in rendered state: {item.get('repo')}")

          for repo in state["now_building"]:
              if "health" not in repo or "ci" not in repo:
                  raise SystemExit("NOW BUILDING repository is missing health / CI state")

          ci = state["ci_signal"]
          for key in ("label", "evaluated", "passed", "failed", "pass_rate", "repos_with_signal"):
              if key not in ci:
                  raise SystemExit(f"CI SIGNAL is missing key: {key}")

          recap = state["dev_recap"]
          for key in ("tracked_from", "tracked_days", "active_days", "longest_streak", "weekly", "monthly", "achievements"):
              if key not in recap:
                  raise SystemExit(f"DEV RECAP is missing key: {key}")

          readme = Path("README.md").read_text(encoding="utf-8")
          for marker in (
              "PROFILE-SIGNAL:LIVE-SIGNAL:START",
              "DAILY-ACTIVITY:START",
              "PROFILE-SIGNAL:FOCUS:START",
              "PROFILE-SIGNAL:PULSE:START",
              "PROFILE-SIGNAL:NOW-BUILDING:START",
              "PROFILE-SIGNAL:ACTIVITY-STREAM:START",
              "PROFILE-SIGNAL:RECAP:START",
          ):
              if marker not in readme:
                  raise SystemExit(f"Missing README marker: {marker}")
          for heading in (
              "## LIVE SIGNAL // Development status",
              "## TODAY // Activity overview",
              "## CURRENT FOCUS // What is moving now",
              "## DEV PULSE // Last 7 days",
              "### QUALITY SIGNAL // Last 7 days",
              "## NOW BUILDING // Active repositories",
              "## ACTIVITY STREAM // Latest public signals",
              "## DEV RECAP // Tracked history",
          ):
              if heading not in readme:
                  raise SystemExit(f"Profile heading missing: {heading}")
          for summary_heading in ("MONTHLY SUMMARY", "YEARLY SUMMARY //", "LIFETIME SUMMARY // Tracked history"):
              if summary_heading not in readme:
                  raise SystemExit(f"Long-term summary missing: {summary_heading}")
          if "加重アクティビティ" in readme or "スコア " in readme:
              raise SystemExit("Unnatural translated engineering metric remained in README")
          for english_event in ("commit pushed to", "commits pushed to", "PR merged #", "Opened issue #", "Closed issue #"):
              if english_event in readme:
                  raise SystemExit(f"Known English activity title remained in Japanese README: {english_event}")

          ET.parse("assets/dev-pulse.svg")
          print(
              f"Validated {len(logs)} daily snapshots, {len(weekly)} weekly reports, "
              f"{len(monthly)} monthly reports, repository filters, hybrid rendering and long-term summaries"
          )
          PY

  refresh-profile-stream:
    if: github.event_name == 'schedule' && github.event.schedule == '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

      - name: Resolve configured README path
        id: profile-config
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path('.github/profile-signal.yml').read_text(encoding='utf-8')) or {}
          readme_path = str((config.get('readme') or {}).get('path') or 'README.md')
          if '\n' in readme_path or '\r' in readme_path:
              raise SystemExit('readme.path must not contain newlines')
          print(f'readme_path={readme_path}')
          PY

      - name: Refresh live-facing Profile Signal widgets
        env:
          PROFILE_SIGNAL_CONFIG: .github/profile-signal.yml
        run: python .profile-signal/src/stream_runtime.py

      - name: Apply consumer view and repository filters
        run: python scripts/profile_signal_customize.py

      - name: Localize known activity titles
        run: python scripts/localize_profile_activity.py

      - name: Commit live signal changes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          README_PATH: ${{ steps.profile-config.outputs.readme_path }}
        run: |
          set -euo pipefail
          paths=("$README_PATH" data/profile-signal-state.json)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "No live signal changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No staged live signal changes"
            exit 0
          fi
          git commit -m "chore(profile): refresh latest signals [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto origin/${TARGET_BRANCH}"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/${TARGET_BRANCH}"
          done
          echo "Failed to push latest signals after 3 attempts" >&2
          exit 1

  update-profile-activity:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '19 */3 * * *')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Profile Signal dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

      - name: Update profile through installed Profile Signal runtime
        uses: ./.profile-signal
        with:
          config: .github/profile-signal.yml

      - name: Apply consumer view and repository filters
        run: python scripts/profile_signal_customize.py

      - name: Localize known activity titles
        run: python scripts/localize_profile_activity.py

      - name: Commit generated profile activity
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- README.md data/activity data/weekly data/monthly data/profile-signal-state.json)" ]; then
            echo "No profile activity changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            data/activity \
            data/weekly \
            data/monthly \
            data/profile-signal-state.json
          git commit -m "chore(profile): refresh Profile Signal [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto latest ${TARGET_BRANCH}"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/${TARGET_BRANCH}"
          done
          echo "Failed to push profile activity after 3 attempts" >&2
          exit 1
