name: Profile Signal external trigger

on:
  pull_request:
    paths:
      - .github/workflows/profile-signal-external-trigger.yml
      - .github/profile-signal.yml
      - .profile-signal/**
      - scripts/profile_signal_customize.py
      - scripts/localize_profile_activity.py
  repository_dispatch:
    types:
      - profile-signal-stream
      - profile-signal-full
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode
        required: true
        default: stream
        type: choice
        options:
          - stream
          - full

permissions:
  contents: read

concurrency:
  group: profile-signal-profile-write-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  validate-external-trigger:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate external refresh runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python -m py_compile \
            .profile-signal/src/*.py \
            .profile-signal/scripts/*.py \
            scripts/profile_signal_customize.py \
            scripts/localize_profile_activity.py
          python .profile-signal/src/stream_runtime.py
          python scripts/profile_signal_customize.py
          python scripts/localize_profile_activity.py
          git diff --check -- README.md data/profile-signal-state.json

  refresh-from-external-trigger:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

      - name: Resolve refresh mode
        id: refresh-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$EVENT_ACTION" in
              profile-signal-stream) mode="stream" ;;
              profile-signal-full) mode="full" ;;
              *)
                echo "Unsupported repository_dispatch action: $EVENT_ACTION" >&2
                exit 1
                ;;
            esac
          else
            mode="${MANUAL_MODE:-stream}"
          fi

          case "$mode" in
            stream|full) ;;
            *)
              echo "Unsupported refresh mode: $mode" >&2
              exit 1
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Profile Signal external refresh mode: $mode"

      - name: Run full Profile Signal refresh
        if: steps.refresh-mode.outputs.mode == 'full'
        uses: ./.profile-signal
        with:
          config: .github/profile-signal.yml

      - name: Run lightweight Profile Signal refresh
        if: steps.refresh-mode.outputs.mode == 'stream'
        env:
          PROFILE_SIGNAL_CONFIG: .github/profile-signal.yml
        run: python .profile-signal/src/stream_runtime.py

      - name: Apply consumer view and repository filters
        run: python scripts/profile_signal_customize.py

      - name: Localize known activity titles
        run: python scripts/localize_profile_activity.py

      - name: Commit external Profile Signal refresh
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          REFRESH_MODE: ${{ steps.refresh-mode.outputs.mode }}
        run: |
          set -euo pipefail

          if [ "$REFRESH_MODE" = "full" ]; then
            paths=(README.md assets/dev-pulse.svg data/activity data/weekly data/monthly data/profile-signal-state.json)
            message="chore(profile): refresh Profile Signal external [skip ci]"
          else
            paths=(README.md data/profile-signal-state.json)
            message="chore(profile): refresh latest signals external [skip ci]"
          fi

          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "No Profile Signal changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No staged Profile Signal changes"
            exit 0
          fi

          git commit -m "$message"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto origin/${TARGET_BRANCH}"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/${TARGET_BRANCH}"
          done

          echo "Failed to push external Profile Signal refresh after 3 attempts" >&2
          exit 1
