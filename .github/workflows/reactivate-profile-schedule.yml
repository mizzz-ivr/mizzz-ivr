name: Reactivate profile schedule

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reactivate-profile-schedule.yml
      - .github/workflows/update-readme.yml

permissions:
  actions: write
  contents: write

jobs:
  reactivate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify canonical schedule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/update-readme.yml').read_text(encoding='utf-8')
          cron = '*/5 * * * *'
          legacy = '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
          if text.count(cron) != 2:
              raise SystemExit(f'Expected two canonical cron references, found {text.count(cron)}')
          if legacy in text:
              raise SystemExit('Legacy cron reference is still present')
          PY

      - name: Enable Update profile activity workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-readme.yml/enable"

      - name: Run manual smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/update-readme.yml/dispatches" -f ref=main

      - name: Delete reactivation branches
        run: |
          set -euo pipefail
          for branch in fix/profile-schedule-reactivation fix/profile-schedule-reactivation-v2; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
