name: Prune final cleanup branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-final-cleanup-branch.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Delete merged cleanup branch
        run: git push origin --delete chore/remove-legacy-activity-chart
