name: Profile Signal release

on:
  pull_request:
    paths:
      - .profile-signal/**
      - distribution/**
      - release-notes/**
      - docs/wiki/**
      - PROFILE_SIGNAL_LICENSE.md
      - scripts/build-profile-signal-release.py
      - .github/workflows/profile-signal-release.yml
  push:
    branches:
      - main
    paths:
      - release-notes/**
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  validate-package:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build release archive
        run: |
          python scripts/build-profile-signal-release.py --version v0.0.0-test
          python -m zipfile -t dist/profile-signal-v0.0.0-test.zip
          unzip -l dist/profile-signal-v0.0.0-test.zip

      - name: Smoke test extracted install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

          fixture="${RUNNER_TEMP}/profile-signal-smoke"
          mkdir -p "$fixture"
          unzip -q dist/profile-signal-v0.0.0-test.zip -d "$fixture"
          cd "$fixture"

          printf '# Profile Signal smoke test\n' > README.md
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/profile-signal.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('YOUR_GITHUB_USERNAME', 'mizzz-ivr')
          text = text.replace('preset: standard', 'preset: full')
          path.write_text(text, encoding='utf-8')
          PY

          GITHUB_WORKSPACE="$fixture" \
          PROFILE_SIGNAL_CONFIG=.github/profile-signal.yml \
          python .profile-signal/src/orchestrator.py

          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          readme = Path('README.md').read_text(encoding='utf-8')
          for marker in (
              'PROFILE-SIGNAL:LIVE-SIGNAL:START',
              'DAILY-ACTIVITY:START',
              'PROFILE-SIGNAL:FOCUS:START',
              'PROFILE-SIGNAL:PULSE:START',
              'PROFILE-SIGNAL:NOW-BUILDING:START',
              'PROFILE-SIGNAL:ACTIVITY-STREAM:START',
              'PROFILE-SIGNAL:RECAP:START',
          ):
              if marker not in readme:
                  raise SystemExit(f'missing generated marker: {marker}')

          state = json.loads(Path('data/profile-signal-state.json').read_text(encoding='utf-8'))
          if state.get('scope') != 'public':
              raise SystemExit('smoke test must remain public-only')
          if state.get('schema_version') != 4:
              raise SystemExit('unexpected Profile Signal schema version')
          if 'dev_recap' not in state or 'ci_signal' not in state:
              raise SystemExit('full runtime smoke test is missing operations/history state')

          ET.parse('assets/dev-pulse.svg')
          print('Release ZIP extraction and full local installation smoke test succeeded')
          PY

      - name: Validate installed workflow staging without assets
        shell: bash
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/profile-signal-minimal-stage"
          mkdir -p "$fixture/data"
          cd "$fixture"
          git init -q
          git config user.name test
          git config user.email test@example.com
          printf '# Minimal profile\n' > README.md
          printf '{}\n' > data/snapshot.json
          git add README.md data
          git commit -qm baseline

          printf '\nchanged\n' >> README.md
          printf '{"changed":true}\n' > data/snapshot.json

          git add README.md
          for path in assets data; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "Expected minimal-preset changes to be staged" >&2
            exit 1
          fi
          git diff --cached --name-only
          echo "Installed workflow staging succeeds when assets/ is absent"

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-package
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Normalize release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [[ "$version" != v* ]]; then
            version="v${version}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"

      - name: Build release archive
        run: |
          python scripts/build-profile-signal-release.py --version "$VERSION"
          python -m zipfile -t "dist/profile-signal-${VERSION}.zip"

      - name: Prepare Japanese release notes
        shell: bash
        run: |
          set -euo pipefail
          source_notes="release-notes/${VERSION}.md"
          target_notes="${RUNNER_TEMP}/release-notes.md"

          if [ -f "$source_notes" ]; then
            cp "$source_notes" "$target_notes"
          else
            cat > "$target_notes" <<'EOF'
          ## Profile Signal __VERSION__

          GitHub Profile READMEへ公開GitHub Activityから生成した開発状況Widgetを自動挿入するReleaseです。

          ### 導入

          1. Assetsから `profile-signal-__VERSION__.zip` をダウンロードします。
          2. 自分のGitHub Profile Repositoryのrootへ展開します。
          3. `.github/profile-signal.yml` のusernameを変更します。
          4. commit / push後、**Actions → Profile Signal → Run workflow** を実行します。

          標準構成はpublic-onlyで、API SecretやPATは不要です。

          ### License

          Profile Signal runtimeはMIT Licenseです。
          EOF
            sed -i "s/__VERSION__/${VERSION}/g" "$target_notes"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            "dist/profile-signal-${VERSION}.zip#Profile Signal ${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_BRANCH" \
            --title "Profile Signal ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

  sync-release-notes:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync Japanese notes to published releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for notes in release-notes/v*.md; do
            version="$(basename "$notes" .md)"
            if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Syncing ${version} release notes"
              gh release edit "$version" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Profile Signal ${version}" \
                --notes-file "$notes"
            fi
          done
