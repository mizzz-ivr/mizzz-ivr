  <line class="axis" x1="460.0" y1="210.0" x2="460.0" y2="85.0" /><line class="axis" x1="460.0" y1="210.0" x2="578.9" y2="171.4" /><line class="axis" x1="460.0" y1="210.0" x2="533.5" y2="311.1" /><line class="axis" x1="460.0" y1="210.0" x2="386.5" y2="311.1" /><line class="axis" x1="460.0" y1="210.0" x2="341.1" y2="171.4" />
