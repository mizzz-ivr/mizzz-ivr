<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-labelledby="title desc">
  <title id="title">Developer activity pulse for the last seven days</title>
  <desc id="desc">Seven day public GitHub activity totals, with today's commit, pull request and issue counts.</desc>
  <style>
    .title { fill: #24292f; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; }
    .meta { fill: #57606a; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #57606a; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #57606a; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .area { fill: #8b5cf6; fill-opacity: .10; }
    .line { fill: none; stroke: #8b5cf6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .point { fill: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .meta, .label, .value { fill: #8c959f; }
      .grid { stroke: #30363d; }
      .area { fill: #a78bfa; fill-opacity: .12; }
      .line { stroke: #a78bfa; }
      .point { fill: #a78bfa; }
    }
  </style>
  <text class="title" x="24" y="25">DEV PULSE · LAST 7 DAYS</text>
  <text class="meta" x="856" y="25" text-anchor="end">C 0 · PR 1 · ISSUE 0</text>
  <line class="grid" x1="24" y1="148.5" x2="856" y2="148.5" />
  <polygon class="area" points="85,148 85,58 197,134 309,134 421,120 533,65 645,79 757,141 757,148" />
  <polyline class="line" points="85,58 197,134 309,134 421,120 533,65 645,79 757,141" />
  <circle class="point" cx="85" cy="58" r="5" /><circle class="point" cx="197" cy="134" r="5" /><circle class="point" cx="309" cy="134" r="5" /><circle class="point" cx="421" cy="120" r="5" /><circle class="point" cx="533" cy="65" r="5" /><circle class="point" cx="645" cy="79" r="5" /><circle class="point" cx="757" cy="141" r="5" />
  <text class="label" x="85" y="177" text-anchor="middle">09-19</text><text class="value" x="85" y="48" text-anchor="middle">13</text><text class="label" x="197" y="177" text-anchor="middle">09-20</text><text class="value" x="197" y="124" text-anchor="middle">2</text><text class="label" x="309" y="177" text-anchor="middle">09-21</text><text class="value" x="309" y="124" text-anchor="middle">2</text><text class="label" x="421" y="177" text-anchor="middle">09-22</text><text class="value" x="421" y="110" text-anchor="middle">4</text><text class="label" x="533" y="177" text-anchor="middle">09-23</text><text class="value" x="533" y="55" text-anchor="middle">12</text><text class="label" x="645" y="177" text-anchor="middle">09-24</text><text class="value" x="645" y="69" text-anchor="middle">10</text><text class="label" x="757" y="177" text-anchor="middle">09-25</text><text class="value" x="757" y="131" text-anchor="middle">1</text>
